                  b.isAllCaps = false
                  b.setTextColor(Color.WHITE)
                  b.textSize = 14f
                  b.background = round(color, dp(c, 14).toFloat())
                  b.setPadding(dp(c, 14), dp(c, 8), dp(c, 14), dp(c, 8))
                  b.setOnClickListener { click() }
                  return b
              }

