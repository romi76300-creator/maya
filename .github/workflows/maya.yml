                      "Jaan, ye kaam nahi ho paya."              private fun has(ctx: Context, perm: String): Boolean =
                  ctx.checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED

              private fun newTask(i: Intent): Intent {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return i
              }

              private fun view(ctx: Context, url: String): String? {
                  ctx.startActivity(newTask(Intent(Intent.ACTION_VIEW, Uri.parse(url))))
                  return null
              }

              private fun openApp(ctx: Context, name: String): String? {
                  val q = name.trim().lowercase()
                  if (q.isEmpty()) return null
                  val pm = ctx.packageManager
                  val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(main, 0)
                  val hit = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                      ?: return "Jaan, " + name + " naam ka app mujhe mila nahi."
                  val i = pm.getLaunchIntentForPackage(hit.activityInfo.packageName)
                      ?: return "Ye app khul nahi raha jaan."
                  ctx.startActivity(newTask(i))
                  return null
              }

              private fun findNumber(ctx: Context, name: String): String? {
                  if (!has(ctx, Manifest.permission.READ_CONTACTS)) return null
                  val q = name.trim().lowercase()
                  if (q.isEmpty()) return null
                  val cur = ctx.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ),
                      null, null, null
                  ) ?: return null
                  var exact: String? = null
                  var part: String? = null
                  cur.use {
                      while (it.moveToNext()) {
                          val n = (it.getString(0) ?: "").lowercase()
                          val num = it.getString(1) ?: continue
                          if (n == q) {
                              if (exact == null) exact = num
                          } else if (n.contains(q)) {
                              if (part == null) part = num
                          }
                      }
                  }
                  return exact ?: part
              }

              private fun waNumber(raw: String): String {
                  var d = raw.filter { it.isDigit() }
                  if (d.length == 11 && d.startsWith("0")) d = d.substring(1)
                  if (d.length == 10) d = "91" + d
                  return d
              }

              private fun call(ctx: Context, who: String): String? {
                  if (!has(ctx, Manifest.permission.CALL_PHONE)) return "Jaan, call ki permission Setup mein de do."
                  val num = findNumber(ctx, who) ?: return who + " naam ka contact mujhe nahi mila jaan."
                  ctx.startActivity(newTask(Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(num)))))
                  return null
              }

              private fun sms(ctx: Context, who: String, text: String): String? {
                  if (!has(ctx, Manifest.permission.SEND_SMS)) return "Jaan, SMS ki permission Setup mein de do."
                  val num = findNumber(ctx, who) ?: return who + " naam ka contact mujhe nahi mila jaan."
                  val sm: SmsManager = if (Build.VERSION.SDK_INT >= 31) {
                      ctx.getSystemService(SmsManager::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      SmsManager.getDefault()
                  }
                  sm.sendMultipartTextMessage(num, null, sm.divideMessage(text), null, null)
                  return null
              }

              private fun whatsapp(ctx: Context, who: String, text: String): String? {
                  val num = findNumber(ctx, who) ?: return who + " naam ka contact mujhe nahi mila jaan."
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/" + waNumber(num) + "?text=" + Uri.encode(text)))
                  i.setPackage("com.whatsapp")
                  ctx.startActivity(newTask(i))
                  return null
              }

              private fun lock(ctx: Context): String? {
                  val dpm = ctx.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val admin = ComponentName(ctx, AdminReceiver::class.java)
                  if (!dpm.isAdminActive(admin)) return "Jaan, pehle Setup mein Device Admin on kar do, phir lock kar paungi."
                  dpm.lockNow()
                  return null
              }

              private fun flashlight(ctx: Context, on: Boolean): String? {
                  val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                  val id = cm.cameraIdList.firstOrNull {
                      cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                  } ?: return "Is phone mein flash mila nahi jaan."
                  cm.setTorchMode(id, on)
                  return null
              }

              private fun volume(ctx: Context, dir: String): String? {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  when (dir) {
                      "up" -> repeat(3) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                      }
                      "down" -> repeat(3) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                      }
                      "mute" -> am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, AudioManager.FLAG_SHOW_UI)
                  }
                  return null
              }
          }
