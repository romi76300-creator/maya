          class MayaService : Service() {

              companion object {
                  const val ACTION_TEXT = "com.ankit.maya.TEXT"
                  const val ACTION_LISTEN = "com.ankit.maya.LISTEN"
                  const val ACTION_STOP = "com.ankit.maya.STOP"
                  private const val CHANNEL = "maya_channel"
              }

              private val main = Handler(Looper.getMainLooper())
              private val worker = Executors.newSingleThreadExecutor()
              private var model: Model? = null
              private var wake: SpeechService? = null
              private var recognizer: SpeechRecognizer? = null
              private var voice: Voice? = null
              private var overlay: View? = null
              @Volatile private var busy = false
              @Volatile private var alive = true

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  alive = true
                  if (!goForeground()) {
                      stopSelf()
                      return
                  }
                  voice = Voice(this)
                  showOverlay()
                  main.post(tick)
                  MayaState.status = "Maya shuru ho rahi hai..."
                  worker.execute { loadModelAndListen() }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  goForeground()
                  when (intent?.action) {
                      ACTION_TEXT -> {
                          val t = intent?.getStringExtra("text") ?: ""
                          if (t.isNotBlank() && !busy) {
                              busy = true
                              worker.execute {
                                  stopWake()
                                  process(t)
                              }
                          }
                      }
                      ACTION_LISTEN -> main.post { startCommandListening() }
                      ACTION_STOP -> {
                          stopSelf()
                      }
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  alive = false
                  main.removeCallbacksAndMessages(null)
                  try { recognizer?.destroy() } catch (e: Exception) { }
                  stopWake()
                  try {
                      overlay?.let { (getSystemService(Context.WINDOW_SERVICE) as WindowManager).removeView(it) }
                  } catch (e: Exception) { }
                  overlay = null
                  voice?.shutdown()
                  MayaState.mode = Mode.IDLE
                  MayaState.status = "Maya band hai"
                  super.onDestroy()
              }

              // ---------- foreground notification ----------

              private fun goForeground(): Boolean {
                  return try {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(NotificationChannel(CHANNEL, "Maya", NotificationManager.IMPORTANCE_LOW))
                      val stop = PendingIntent.getService(
                          this, 1, Intent(this, MayaService::class.java).setAction(ACTION_STOP), PendingIntent.FLAG_IMMUTABLE
                      )
                      val open = PendingIntent.getActivity(
                          this, 2, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                      )
                      val n = Notification.Builder(this, CHANNEL)
                          .setContentTitle("Maya sun rahi hai")
                          .setContentText("Bolo \"Maya\" aur apni baat kaho")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentIntent(open)
                          .addAction(Notification.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel, "Band karo", stop).build())
                          .setOngoing(true)
                          .build()
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                      } else {
                          startForeground(1, n)
                      }
                      true
                  } catch (e: Exception) {
                      MayaState.status = "Service error: " + e.message
                      false
                  }
              }

              // ---------- floating orb ----------

              private fun showOverlay() {
                  try {
                      if (!Settings.canDrawOverlays(this)) return
                      val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      val v = OrbView(this, false)
                      val d = resources.displayMetrics.density
                      val size = (110 * d).toInt()
                      val lp = WindowManager.LayoutParams(
                          size, size,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      )
                      lp.gravity = Gravity.TOP or Gravity.END
                      lp.x = 0
                      lp.y = (150 * d).toInt()
                      v.setOnClickListener { startCommandListening() }
                      wm.addView(v, lp)
                      overlay = v
                  } catch (e: Exception) {
                      overlay = null
                  }
              }

              private val tick = object : Runnable {
                  override fun run() {
                      if (!alive) return
                      overlay?.visibility = if (MayaState.appVisible) View.GONE else View.VISIBLE
                      main.postDelayed(this, 600)
                  }
              }

              // ---------- wake word (Vosk, offline) ----------

              private fun copyAssets(path: String, dest: File) {
                  val list = assets.list(path)
                  if (list == null || list.isEmpty()) {
                      dest.parentFile?.mkdirs()
                      try {
                          assets.open(path).use { i -> FileOutputStream(dest).use { o -> i.copyTo(o) } }
                      } catch (e: IOException) {
                          dest.mkdirs()
                      }
                  } else {
                      dest.mkdirs()
                      for (f in list) copyAssets(path + "/" + f, File(dest, f))
                  }
              }

              private fun loadModelAndListen() {
                  try {
                      val dir = File(filesDir, "model")
                      val marker = File(dir, ".ok")
                      if (!marker.exists()) {
                          MayaState.status = "Pehli baar tayyari ho rahi hai (1-2 minute)..."
                          dir.deleteRecursively()
                          copyAssets("model-en-us", dir)
                          marker.writeText("ok")
                      }
                      model = Model(dir.absolutePath)
                      main.post { startWake() }
                  } catch (e: Exception) {
                      MayaState.status = "Wake word error: " + e.message + " (orb dabakar baat karo)"
                  }
              }

              private val wakeListener = object : VoskListener {
                  override fun onPartialResult(hypothesis: String?) { look(hypothesis) }
                  override fun onResult(hypothesis: String?) { look(hypothesis) }
                  override fun onFinalResult(hypothesis: String?) { look(hypothesis) }
                  override fun onError(exception: Exception?) {
                      MayaState.status = "Mic error: " + exception?.message
                  }
                  override fun onTimeout() {}

                  private fun look(h: String?) {
                      if (h == null || busy) return
                      val s = h.lowercase()
                      if (s.contains("maya") || s.contains("maia")) {
                          startCommandListening()
                      }
                  }
              }

              private fun startWake() {
                  val m = model ?: return
                  if (busy || !alive) return
                  try {
                      stopWake()
                      val rec = Recognizer(m, 16000.0f, "[\"maya\", \"maia\", \"[unk]\"]")
                      val ss = SpeechService(rec, 16000.0f)
                      ss.startListening(wakeListener)
                      wake = ss
                      MayaState.mode = Mode.IDLE
                      MayaState.status = "Bolo \"Maya\"..."
                  } catch (e: Exception) {
                      MayaState.status = "Wake start error: " + e.message
                  }
              }

              private fun stopWake() {
                  try {
                      wake?.stop()
                      wake?.shutdown()
                  } catch (e: Exception) { }
                  wake = null
              }

              // ---------- command listening (Google speech, Hinglish) ----------

              private fun startCommandListening() {
                  if (busy) return
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      MayaState.status = "Is phone mein speech recognition nahi mila"
                      return
                  }
                  busy = true
                  MayaState.mode = Mode.LISTENING
                  MayaState.status = "Sun rahi hoon..."
                  worker.execute {
                      stopWake()
                      try { Thread.sleep(300) } catch (e: InterruptedException) { }
                      main.post { beginRecognizer() }
                  }
              }

              private fun beginRecognizer() {
                  try {
                      recognizer?.destroy()
                      val r = SpeechRecognizer.createSpeechRecognizer(this)
                      r.setRecognitionListener(cmdListener)
                      recognizer = r
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                      i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false)
                      i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                      r.startListening(i)
                  } catch (e: Exception) {
                      MayaState.status = "Listen error: " + e.message
                      finishTurn()
                  }
              }

              private val cmdListener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(rmsdB: Float) {}
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onPartialResults(partialResults: Bundle?) {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onError(error: Int) {
                      MayaState.status = if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                          "Mic permission nahi hai"
                      } else {
                          "Kuch sunai nahi diya"
                      }
                      finishTurn()
                  }

                  override fun onResults(results: Bundle?) {
                      val list = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                      val text = list?.firstOrNull()
                      if (text.isNullOrBlank()) {
                          finishTurn()
                      } else {
                          worker.execute { process(text) }
                      }
                  }
              }

              // ---------- think, speak, act ----------

              private fun process(text: String) {
                  try {
                      MayaState.heard = text
                      MayaState.mode = Mode.THINKING
                      MayaState.status = "Soch rahi hoon..."
                      val reply = Brain.ask(this, text)
                      MayaState.reply = reply.speech
                      MayaState.mode = Mode.SPEAKING
                      MayaState.status = "Bol rahi hoon..."
                      voice?.speak(reply.speech)
                      val extra = Actions.run(this, reply)
                      if (extra != null) {
                          MayaState.reply = extra
                          voice?.speak(extra)
                      }
                  } catch (e: Exception) {
                      MayaState.status = "Error: " + e.message
                  }
                  main.post { finishTurn() }
              }

              private fun finishTurn() {
                  try { recognizer?.destroy() } catch (e: Exception) { }
                  recognizer = null
                  busy = false
                  MayaState.mode = Mode.IDLE
                  if (alive) startWake()
