          package com.ankit.maya

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          class Voice(private val ctx: Context) {

              private var tts: TextToSpeech? = null
              @Volatile private var ttsReady = false
              @Volatile private var blockedUntil = 0L
              private val ttsModels = arrayOf("gemini-2.5-flash-preview-tts", "gemini-2.5-flash-tts")

              init {
                  tts = TextToSpeech(ctx.applicationContext) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.language = Locale("hi", "IN")
                          tts?.setPitch(1.2f)
                          ttsReady = true
                      }
                  }
              }

              fun speak(text: String) {
                  if (text.isBlank()) return
                  val pcm = geminiTts(text)
                  if (pcm != null) play(pcm) else fallback(text)
              }

              fun shutdown() {
                  try { tts?.shutdown() } catch (e: Exception) { }
              }

              private fun geminiTts(text: String): ByteArray? {
                  val key = Prefs.key(ctx)
                  if (key.isEmpty()) return null
                  if (System.currentTimeMillis() < blockedUntil) return null
                  val body = JSONObject()
                      .put(
                          "contents",
                          JSONArray().put(
                              JSONObject().put(
                                  "parts",
                                  JSONArray().put(
                                      JSONObject().put(
                                          "text",
                                          "Say this in a sweet, warm, affectionate young woman's voice, naturally, in Hinglish: " + text
                                      )
                                  )
                              )
                          )
                      )
                      .put(
                          "generationConfig",
                          JSONObject()
                              .put("responseModalities", JSONArray().put("AUDIO"))
                              .put(
                                  "speechConfig",
                                  JSONObject().put(
                                      "voiceConfig",
                                      JSONObject().put("prebuiltVoiceConfig", JSONObject().put("voiceName", Prefs.voice(ctx)))
                                  )
                              )
                      )
                      .toString()
                  for (m in ttsModels) {
                      try {
                          val (code, resp) = Net.post(
                              "https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent", key, body
                          )
                          if (code == 200) {
                              val parts = JSONObject(resp).getJSONArray("candidates").getJSONObject(0)
                                  .getJSONObject("content").getJSONArray("parts")
                              for (i in 0 until parts.length()) {
                                  val p = parts.getJSONObject(i)
                                  val inl = p.optJSONObject("inlineData") ?: p.optJSONObject("inline_data")
                                  if (inl != null) {
                                      return Base64.decode(inl.getString("data"), Base64.DEFAULT)
                                  }
                              }
                          } else if (code == 429) {
                              blockedUntil = System.currentTimeMillis() + 60000
                              return null
                          }
                      } catch (e: Exception) {
                      }
                  }
                  blockedUntil = System.currentTimeMillis() + 20000
                  return null
              }

              private fun play(pcm: ByteArray) {
                  val sr = 24000
                  val at = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(sr)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(pcm.size)
                      .setTransferMode(AudioTrack.MODE_STATIC)
                      .build()
                  at.write(pcm, 0, pcm.size)
                  at.play()
                  Thread.sleep(pcm.size / 2L * 1000L / sr + 250L)
                  at.stop()
                  at.release()
              }

              private fun fallback(text: String) {
                  var waited = 0
                  while (!ttsReady && waited < 20) {
                      Thread.sleep(100)
                      waited++
                  }
                  val t = tts ?: return
                  if (!ttsReady) return
                  val latch = CountDownLatch(1)
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onDone(utteranceId: String?) { latch.countDown() }
                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) { latch.countDown() }
                  })
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "maya")
                  latch.await(30, TimeUnit.SECONDS)
              }
          }
