          package com.ankit.maya

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          class OrbView(context: Context, private val showText: Boolean = true) : View(context) {

              private val n = 360
              private val ux = FloatArray(n)
              private val uy = FloatArray(n)
              private val uz = FloatArray(n)
              private val dot = Paint(Paint.ANTI_ALIAS_FLAG)
              private val glow = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG)
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG)
              private val oval = RectF()
              private val t0 = System.nanoTime()
              private val d = context.resources.displayMetrics.density
              private var smooth = 0f

              init {
                  ring.style = Paint.Style.STROKE
                  txt.color = Color.WHITE
                  txt.typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  txt.textAlign = Paint.Align.CENTER
                  txt.letterSpacing = 0.18f
                  val ga = Math.PI * (3.0 - sqrt(5.0))
                  for (i in 0 until n) {
                      val y = 1f - (i / (n - 1f)) * 2f
                      val rad = sqrt(max(0f, 1f - y * y))
                      val th = (ga * i).toFloat()
                      ux[i] = cos(th) * rad
                      uz[i] = sin(th) * rad
                      uy[i] = y
                  }
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  val r = max(min(w, h) * 0.5f, 1f)
                  glow.shader = RadialGradient(
                      w / 2f, h / 2f, r,
                      intArrayOf(Color.argb(150, 255, 150, 40), Color.argb(70, 40, 110, 255), Color.TRANSPARENT),
                      floatArrayOf(0f, 0.55f, 1f),
                      Shader.TileMode.CLAMP
                  )
              }

              private fun drawRing(c: Canvas, cx: Float, cy: Float, rx: Float, ratio: Float, rot: Float, col: Int, sw: Float) {
                  c.save()
                  c.translate(cx, cy)
                  c.rotate(rot)
                  oval.set(-rx, -rx * ratio, rx, rx * ratio)
                  ring.color = col
                  ring.alpha = 70
                  ring.strokeWidth = sw * 3f * d
                  c.drawOval(oval, ring)
                  ring.color = col
                  ring.strokeWidth = sw * d
                  c.drawOval(oval, ring)
                  c.restore()
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val cx = w / 2f
                  val cy = h / 2f
                  val r = min(w, h) * 0.27f
                  val t = (System.nanoTime() - t0) / 1e9f
                  val mode = MayaState.mode

                  val target = when (mode) {
                      Mode.LISTENING -> 1f
                      Mode.SPEAKING -> 1.6f
                      Mode.THINKING -> 0.7f
                      else -> 0.25f
                  }
                  smooth += (target - smooth) * 0.06f
                  val pulse = 1f + 0.05f * smooth * sin(t * (4f + 3f * smooth))
                  val rr = r * pulse

                  glow.alpha = (110 + 90 * min(smooth, 1.2f)).toInt().coerceIn(0, 255)
                  c.drawCircle(cx, cy, min(w, h) * 0.5f, glow)

                  val a = t * (0.35f + 0.5f * smooth)
                  val ca = cos(a)
                  val sa = sin(a)
                  for (i in 0 until n) {
                      val x = ux[i] * ca + uz[i] * sa
                      val z = -ux[i] * sa + uz[i] * ca
                      val depth = (z + 1f) / 2f
                      val al = (50 + 205 * depth).toInt()
                      dot.color = if (mode == Mode.LISTENING) {
                          Color.argb(al, 90, 220, 255)
                      } else {
                          Color.argb(al, 255, 190 - (40 * depth).toInt(), 70)
                      }
                      c.drawCircle(cx + x * rr, cy + uy[i] * rr, (0.9f + 1.9f * depth) * d, dot)
                  }

                  drawRing(c, cx, cy, rr * 1.55f, 0.28f, 25f + t * 14f * (1f + smooth), Color.rgb(47, 123, 255), 2.4f)
                  drawRing(c, cx, cy, rr * 1.50f, 0.42f, -35f - t * 10f * (1f + smooth), Color.rgb(255, 154, 60), 1.6f)
                  drawRing(c, cx, cy, rr * 1.30f, 0.20f, 80f + t * 20f, Color.rgb(60, 160, 255), 1.8f)

                  if (showText) {
                      txt.textSize = r * 0.34f
                      txt.setShadowLayer(18f * d, 0f, 0f, Color.argb(200, 255, 170, 60))
                      c.drawText("MAYA", cx, cy + txt.textSize * 0.35f, txt)
                  }
                  postInvalidateOnAnimation()
              }
          }
