                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                  })

                  // 6. Battery
                  batteryState = section(root, "6. Battery", "Taaki phone Maya ko background mein band na kare. Allow dabao.")
                  (batteryState.parent as LinearLayout).addView(Ui.button(this, "Allow karo", Ui.BLUE) {
                      startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + packageName)))
                  })

                  // 7. Device admin
                  adminState = section(root, "7. Phone lock", "Maya phone lock kar sake isliye Device Admin on karo.")
                  (adminState.parent as LinearLayout).addView(Ui.button(this, "On karo", Ui.BLUE) {
                      val i = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN)
                      i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, ComponentName(this, AdminReceiver::class.java))
                      i.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Maya ko phone lock karne ke liye.")
                      startActivity(i)
                  })

                  val done = Ui.button(this, "Ho gaya, Maya shuru karo", Ui.BLUE) {
                      Prefs.setKey(this, keyBox.text.toString())
                      Prefs.setOwner(this, nameBox.text.toString())
                      finish()
                  }
                  root.addView(done, lp())

                  setContentView(sv)
              }

              private fun mark(t: TextView, ok: Boolean, okText: String, noText: String) {
                  t.text = if (ok) okText else noText
                  t.setTextColor(if (ok) Ui.GREEN else Ui.ORANGE)
              }

              private fun refresh() {
                  val allPerms = perms.all { checkSelfPermission(it) == PackageManager.PERMISSION_GRANTED }
                  val mic = checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  mark(permState, allPerms, "Ho gaya", if (mic) "Mic mil gaya, baaki abhi baaki hain" else "Abhi baaki hai")
                  mark(overlayState, Settings.canDrawOverlays(this), "Ho gaya", "Abhi baaki hai")
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  mark(batteryState, pm.isIgnoringBatteryOptimizations(packageName), "Ho gaya", "Abhi baaki hai")
                  val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  mark(adminState, dpm.isAdminActive(ComponentName(this, AdminReceiver::class.java)), "Ho gaya", "Abhi baaki hai")
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  refresh()
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              override fun onDestroy() {
                  voice?.shutdown()
                  super.onDestroy()
              }
          }
