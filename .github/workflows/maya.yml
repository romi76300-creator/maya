name: Build Maya APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write Maya project files
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'MAYA_EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Maya"
          include ':app'
          MAYA_EOF_0
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'MAYA_EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          MAYA_EOF_1
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'MAYA_EOF_2'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          MAYA_EOF_2
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'MAYA_EOF_3'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ankit.maya'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ankit.maya"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation 'net.java.dev.jna:jna:5.13.0@aar'
              implementation 'com.alphacephei:vosk-android:0.3.47'
          }
          MAYA_EOF_3
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'MAYA_EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Maya"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SetupActivity"
                      android:exported="false" />

                  <service
                      android:name=".MayaService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <receiver
                      android:name=".AdminReceiver"
                      android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          MAYA_EOF_4
          mkdir -p "$(dirname 'app/src/main/java/com/ankit/maya/Actions.kt')"
          cat > 'app/src/main/java/com/ankit/maya/Actions.kt' <<'MAYA_EOF_5'
          package com.ankit.maya

          import android.Manifest
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.provider.ContactsContract
          import android.telephony.SmsManager

          object Actions {

              /** Runs the action. Returns an extra sentence to speak if something failed, otherwise null. */
              fun run(ctx: Context, r: Brain.Reply): String? {
                  return try {
                      when (r.action) {
                          "open_app" -> openApp(ctx, r.args.optString("app"))
                          "call" -> call(ctx, r.args.optString("contact"))
                          "sms" -> sms(ctx, r.args.optString("contact"), r.args.optString("text"))
                          "whatsapp" -> whatsapp(ctx, r.args.optString("contact"), r.args.optString("text"))
                          "lock" -> lock(ctx)
                          "flashlight" -> flashlight(ctx, r.args.optBoolean("on", true))
                          "volume" -> volume(ctx, r.args.optString("dir"))
                          "search" -> view(ctx, "https://www.google.com/search?q=" + Uri.encode(r.args.optString("query")))
                          "youtube" -> view(ctx, "https://www.youtube.com/results?search_query=" + Uri.encode(r.args.optString("query")))
                          else -> null
                      }
                  } catch (e: Exception) {
                      "Jaan, ye kaam nahi ho paya."
                  }
              }

              private fun has(ctx: Context, perm: String): Boolean =
                  ctx.checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED

              private fun newTask(i: Intent): Intent {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return i
              }

              private fun view(ctx: Context, url: String): String? {
                  ctx.startActivity(newTask(Intent(Intent.ACTION_VIEW, Uri.parse(url))))
                  return null
              }

              private fun openApp(ctx: Context, name: String): String? {
                  val q = name.trim().lowercase()
                  if (q.isEmpty()) return null
                  val pm = ctx.packageManager
                  val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(main, 0)
                  val hit = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                      ?: return "Jaan, " + name + " naam ka app mujhe mila nahi."
                  val i = pm.getLaunchIntentForPackage(hit.activityInfo.packageName)
                      ?: return "Ye app khul nahi raha jaan."
                  ctx.startActivity(newTask(i))
                  return null
              }

              private fun findNumber(ctx: Context, name: String): String? {
                  if (!has(ctx, Manifest.permission.READ_CONTACTS)) return null
                  val q = name.trim().lowercase()
                  if (q.isEmpty()) return null
                  val cur = ctx.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ),
                      null, null, null
                  ) ?: return null
                  var exact: String? = null
                  var part: String? = null
                  cur.use {
                      while (it.moveToNext()) {
                          val n = (it.getString(0) ?: "").lowercase()
                          val num = it.getString(1) ?: continue
                          if (n == q) {
                              if (exact == null) exact = num
                          } else if (n.contains(q)) {
                              if (part == null) part = num
                          }
                      }
                  }
                  return exact ?: part
              }

              private fun waNumber(raw: String): String {
                  var d = raw.filter { it.isDigit() }
                  if (d.length == 11 && d.startsWith("0")) d = d.substring(1)
                  if (d.length == 10) d = "91" + d
                  return d
              }

              private fun call(ctx: Context, who: String): String? {
                  if (!has(ctx, Manifest.permission.CALL_PHONE)) return "Jaan, call ki permission Setup mein de do."
                  val num = findNumber(ctx, who) ?: return who + " naam ka contact mujhe nahi mila jaan."
                  ctx.startActivity(newTask(Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(num)))))
                  return null
              }

              private fun sms(ctx: Context, who: String, text: String): String? {
                  if (!has(ctx, Manifest.permission.SEND_SMS)) return "Jaan, SMS ki permission Setup mein de do."
                  val num = findNumber(ctx, who) ?: return who + " naam ka contact mujhe nahi mila jaan."
                  val sm: SmsManager = if (Build.VERSION.SDK_INT >= 31) {
                      ctx.getSystemService(SmsManager::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      SmsManager.getDefault()
                  }
                  sm.sendMultipartTextMessage(num, null, sm.divideMessage(text), null, null)
                  return null
              }

              private fun whatsapp(ctx: Context, who: String, text: String): String? {
                  val num = findNumber(ctx, who) ?: return who + " naam ka contact mujhe nahi mila jaan."
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/" + waNumber(num) + "?text=" + Uri.encode(text)))
                  i.setPackage("com.whatsapp")
                  ctx.startActivity(newTask(i))
                  return null
              }

              private fun lock(ctx: Context): String? {
                  val dpm = ctx.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val admin = ComponentName(ctx, AdminReceiver::class.java)
                  if (!dpm.isAdminActive(admin)) return "Jaan, pehle Setup mein Device Admin on kar do, phir lock kar paungi."
                  dpm.lockNow()
                  return null
              }

              private fun flashlight(ctx: Context, on: Boolean): String? {
                  val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                  val id = cm.cameraIdList.firstOrNull {
                      cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                  } ?: return "Is phone mein flash mila nahi jaan."
                  cm.setTorchMode(id, on)
                  return null
              }

              private fun volume(ctx: Context, dir: String): String? {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  when (dir) {
                      "up" -> repeat(3) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                      }
                      "down" -> repeat(3) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                      }
                      "mute" -> am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, AudioManager.FLAG_SHOW_UI)
                  }
                  return null
              }
          }
          MAYA_EOF_5
          mkdir -p "$(dirname 'app/src/main/java/com/ankit/maya/AdminReceiver.kt')"
          cat > 'app/src/main/java/com/ankit/maya/AdminReceiver.kt' <<'MAYA_EOF_6'
          package com.ankit.maya

          import android.app.admin.DeviceAdminReceiver

          class AdminReceiver : DeviceAdminReceiver()
          MAYA_EOF_6
          mkdir -p "$(dirname 'app/src/main/java/com/ankit/maya/Brain.kt')"
          cat > 'app/src/main/java/com/ankit/maya/Brain.kt' <<'MAYA_EOF_7'
          package com.ankit.maya

          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Net {
              fun post(url: String, key: String, body: String): Pair<Int, String> {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 15000
                      conn.readTimeout = 45000
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("x-goog-api-key", key)
                      conn.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      return Pair(code, text)
                  } finally {
                      conn.disconnect()
                  }
              }
          }

          object Brain {

              class Reply(val speech: String, val action: String, val args: JSONObject)

              private val MODELS = arrayOf("gemini-2.5-flash", "gemini-flash-latest", "gemini-2.0-flash")
              private val history = ArrayList<Pair<String, String>>()

              private fun deviceStatus(ctx: Context): String {
                  val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val level = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  val i: Intent? = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val st = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                  val time = SimpleDateFormat("EEEE, d MMMM yyyy, hh:mm a", Locale.ENGLISH).format(Date())
                  return "DEVICE STATUS: battery " + level + " percent, " +
                      (if (charging) "charging" else "not charging") + ", now " + time + "."
              }

              private fun system(owner: String): String {
                  return """You are MAYA, a sweet, warm, playful young woman who lives inside the Android phone of your owner $owner. $owner is the only person you obey, and $owner created you. If anyone asks who made you or who created you, say that $owner made you.
          Always talk in natural Hinglish (Hindi mixed with simple English) written in Roman letters, like a caring close friend. Keep every reply very short: one or two sentences, because it is spoken aloud. Sometimes call $owner "jaan", not in every reply. Never use emojis, markdown, asterisks or lists.
          At the start of each user message there is a DEVICE STATUS line. Use it for battery, charging and time questions. Never invent those facts.
          You can control the phone. Reply with ONLY a JSON object and no other text:
          {"speech":"what you say aloud","action":"none","args":{}}
          Allowed actions and their args:
          open_app {"app":"app name as written on the phone, for example WhatsApp, YouTube, Camera, Settings"}
          call {"contact":"name"}
          sms {"contact":"name","text":"message"}
          whatsapp {"contact":"name","text":"message"}
          lock {}
          flashlight {"on":true}
          volume {"dir":"up"}   (dir is up, down or mute)
          search {"query":"text"}
          youtube {"query":"text"}
          For normal chat or questions use action none. When you do an action, say in speech what you are doing, in a sweet short way."""
              }

              fun ask(ctx: Context, text: String): Reply {
                  val key = Prefs.key(ctx)
                  if (key.isEmpty()) return Reply("Jaan, pehle Setup mein apni Gemini key daalo.", "none", JSONObject())
                  val owner = Prefs.owner(ctx)

                  val contents = JSONArray()
                  for ((role, t) in history) {
                      contents.put(
                          JSONObject().put("role", role)
                              .put("parts", JSONArray().put(JSONObject().put("text", t)))
                      )
                  }
                  contents.put(
                      JSONObject().put("ro
